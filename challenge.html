<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header" id="siteHeader">

    <div class="container navbar">

        <div
            class="brand-header-container"
            style="display: flex; align-items: center; gap: 16px;"
        >

            <!-- Logo Trường THPT Giồng Ông Tố -->

            <div
                class="brand-logo"
                style="display: flex; align-items: center;"
            >

                <img
                    src="assets/logo.png"
                    alt="Logo Trường THPT Giồng Ông Tố"
                    style="height: 78px; width: 130px; object-fit: contain;"
                >

            </div>


            <!-- Vạch phân cách -->

            <div
                class="brand-divider"
                style="width: 1px; height: 28px; background-color: rgba(255, 255, 255, 0.25);"
            ></div>


            <!-- LOGO VERITAS -->

           <svg
    class="veritas-logo-svg"
    width="130"
    height="78"
    viewBox="0 0 420 270"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="Veritas Digital Literacy Hub"
>

    <defs>

        <!-- BLUE -->
        <linearGradient
            id="vBlue"
            x1="80"
            y1="30"
            x2="340"
            y2="230"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0" stop-color="#38BDF8"/>
            <stop offset="0.35" stop-color="#2563EB"/>
            <stop offset="1" stop-color="#1D4ED8"/>
        </linearGradient>

        <!-- GOLD -->
        <linearGradient
            id="vGold"
            x1="160"
            y1="50"
            x2="300"
            y2="190"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0" stop-color="#FDE047"/>
            <stop offset="0.45" stop-color="#FACC15"/>
            <stop offset="1" stop-color="#F59E0B"/>
        </linearGradient>

        <!-- CYAN -->
        <linearGradient
            id="vCyan"
            x1="100"
            y1="40"
            x2="340"
            y2="120"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0" stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>

        <!-- WHITE -->
        <linearGradient
            id="vBook"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#E0F2FE"/>
        </linearGradient>

        <!-- SHADOW -->
        <filter
            id="logoShadow"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%"
        >
            <feDropShadow
                dx="0"
                dy="5"
                stdDeviation="5"
                flood-color="#2563EB"
                flood-opacity=".20"
            />
        </filter>

    </defs>

         SHIELD
    ================================================== -->
